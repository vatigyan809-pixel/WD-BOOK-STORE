<!DOCTYPE html>
<html lang="en">

<head>

    <title>Catalogue</title>
    <link rel="stylesheet" href="index.css">

<body>

            </td>

            <td>$63</td>

        <tr>
            <td>
                <img src="java.jpg" width="80" height="100">

                <b>Java 2</b><br>
                Author: Watson<br>
                Publisher: BPB Publications
            </td>

                <button>Add to Cart</button>

        </tr>

        <tr>
            <td>
                <img src="html.jpg" width="80" height="100">
            </td>

            <td>
                <b>HTML in 24 Hours</b><br>

            </td>

            </td>
        </tr>

</html>
